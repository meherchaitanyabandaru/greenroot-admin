name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      # Fails on high or critical advisories in runtime dependencies.
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

      # Errors fail the build; warnings are reported only.
      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Type check and build
        run: npm run build
